plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.ous.dinodream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ous.dinodream'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the runner's debug key so it sideloads over adb like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
