name: Build dino screensaver

# Builds the dino screensaver APK in the cloud, after testing its auto-play bot in
# headless Chrome, and uploads the APK and two test screenshots.
on:
  push:
    branches: [dino-dream]
  workflow_dispatch:

permissions:
  contents: read

env:
  # wayou/t-rex-runner: Chromium's T-Rex game (BSD-3-Clause), pinned to one commit.
  TREX_SHA: 5455bfa408ec6b707c7300ff194b7390733a766d

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dino-dream
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch the T-Rex game
        run: |
          base=https://raw.githubusercontent.com/wayou/t-rex-runner/$TREX_SHA
          dst=src/main/assets/dino
          curl -fsSL --retry 3 -o $dst/index.js  $base/index.js
          curl -fsSL --retry 3 -o $dst/index.css $base/index.css
          curl -fsSL --retry 3 -o $dst/100-offline-sprite.png $base/assets/default_100_percent/100-offline-sprite.png
          curl -fsSL --retry 3 -o $dst/200-offline-sprite.png $base/assets/default_200_percent/200-offline-sprite.png
          curl -fsSL --retry 3 -o $dst/LICENSE-t-rex-runner.txt $base/LICENSE
          ls -l $dst
      - name: Test the bot in headless Chrome
        run: |
          mkdir -p /tmp/pw
          (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.48.2 >/dev/null)
          NODE_PATH=/tmp/pw/node_modules node test/bot-test.js "$PWD/src/main/assets/dino/index.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-test-screenshots
          path: dino-dream/test/*.png
          retention-days: 7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"
      - name: Release build
        run: |
          gradle --no-daemon assembleRelease
          ls -l build/outputs/apk/release/
          sha256sum build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dino-dream-apk
          path: dino-dream/build/outputs/apk/release/*.apk
          retention-days: 7
