name: Build Dino Runner APK

# Builds addons/dino-runner exactly as the add-ons workflow does, and keeps the APK as an artifact so it
# can be installed on a TV for testing. Lives only on the dino-runner-apk branch of the fork, never in the PR.
on:
  push:
    branches: [dino-runner-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Release build
        working-directory: addons/dino-runner
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dino-runner-apk
          path: addons/dino-runner/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
