<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- index.js, index.css and the sprites come from wayou/t-rex-runner (Chromium, BSD-3-Clause),
       fetched at a pinned commit by the build workflow. -->
  <link rel="stylesheet" href="index.css">
  <style>
    /* Dark screensaver: the white page is inverted to black and the dino to light grey,
       the same filter Chrome uses for its night mode. */
    html { background: #fff; filter: invert(1); }
    body { overflow: hidden; cursor: none; }
    #main-content { display: none; }
  </style>
  <script src="index.js"></script>
</head>
<body id="t" class="offline">
  <div id="main-frame-error" class="interstitial-wrapper">
    <!-- Runner.init() hides .icon-offline and throws if it is missing. -->
    <div id="main-content"><div class="icon icon-offline"></div></div>
    <div id="offline-resources">
      <img id="offline-resources-1x" src="100-offline-sprite.png">
      <img id="offline-resources-2x" src="200-offline-sprite.png">
      <template id="audio-resources"></template>
    </div>
  </div>
  <script src="bot.js"></script>
</body>
</html>
